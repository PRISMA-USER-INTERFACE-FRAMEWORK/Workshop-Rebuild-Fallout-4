name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    env:
      COMMONLIBF4_PATH: ${{ github.workspace }}/commonlibf4-nomad
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: checkout CommonLibF4
        uses: actions/checkout@v4
        with:
          repository: G-A-R-D-E-N/commonlibf4-nomad
          ref: main
          path: commonlibf4-nomad
          submodules: recursive

      - name: setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "latest"

      - name: config
        run: xmake config -y --mode=release --toolchain=msvc

      - name: build
        run: xmake build -y -vD PrismaCrafting

      - name: upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PrismaCrafting.dll
          path: build/windows/x64/release/PrismaCrafting.dll
          if-no-files-found: error
